name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "preview, or production (the live site)"
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Production deploys only from main
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys must run from the main branch." >&2
          exit 1

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

      # Tests must pass before anything goes out (production and preview alike).
      - run: npm test

      # The project name comes from wrangler.toml. Secrets reach wrangler through env only;
      # GitHub masks them in the log and nothing here prints them.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          BRANCH: ${{ inputs.target == 'production' && 'main' || 'preview' }}
        run: npx --yes wrangler@4 pages deploy dist --branch="$BRANCH"
