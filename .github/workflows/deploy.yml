name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "preview, or production (the live site)"
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Production deploys only from main
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys must run from the main branch." >&2
          exit 1

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

      # Tests must pass before anything goes out (production and preview alike).
      - run: npm test

      # Secrets reach wrangler and curl through env only; GitHub masks them in the log
      # and nothing here prints them. Names come from site.config.json.
      - name: Pages project (create if missing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -eu
          PROJECT=$(jq -r .pagesProject site.config.json)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          case "$CODE" in
            200) echo "Pages project $PROJECT exists." ;;
            404) npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main ;;
            *) echo "Cloudflare answered $CODE when asked for the project." >&2; exit 1 ;;
          esac

      # The click counters: create the database if missing, write its id into
      # wrangler.toml for this run only, and add the tables (they are IF NOT EXISTS).
      - name: Counter database (production only)
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -eu
          DB=$(jq -r .d1Database site.config.json)
          id() { npx --yes wrangler@4 d1 list --json | jq -r --arg d "$DB" '.[] | select(.name == $d) | .uuid'; }
          ID=$(id)
          if [ -z "$ID" ]; then npx --yes wrangler@4 d1 create "$DB" > /dev/null; ID=$(id); fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx --yes wrangler@4 d1 execute "$DB" --remote --file=schema.sql

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          BRANCH: ${{ inputs.target == 'production' && 'main' || 'preview' }}
        run: npx --yes wrangler@4 pages deploy dist --branch="$BRANCH"

      # Point the domain at the project (once; later runs see it is already there).
      - name: Custom domain (production only)
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          PROJECT=$(jq -r .pagesProject site.config.json)
          DOMAIN=$(jq -r .domain site.config.json)
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          if curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | jq -e --arg d "$DOMAIN" 'any(.result[]; .name == $d)' > /dev/null; then
            echo "$DOMAIN is already attached."
          else
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$DOMAIN\"}" "$API" | jq '{success, status: .result.status}'
          fi
          # The domain needs a DNS record pointing at the project. Add one (proxied CNAME) if
          # the name has no A, AAAA or CNAME record yet; an existing one is left alone.
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZONE=$(curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" | jq -r '.result[0].id')
          RECORDS="https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records"
          if curl -fsS -H "$AUTH" "$RECORDS?name=$DOMAIN" | jq -e 'any(.result[]; .type == "A" or .type == "AAAA" or .type == "CNAME")' > /dev/null; then
            echo "$DOMAIN already has a DNS record."
          else
            curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" \
              "$RECORDS" | jq '{success, type: .result.type, proxied: .result.proxied}'
          fi
