<!doctype html>
<!-- Arena board card, 1200 x 675 (X and Hacker News). Filled in by share/board-card.mjs:
     every slot in double braces is replaced, fonts are inlined, so the result is one self-contained file.
     Colours and fonts follow assets/style.css (dark theme). -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>{{title}}</title>
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; src: url("{{font-sans}}") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("{{font-mono-400}}") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500 600; src: url("{{font-mono-500}}") format("woff2"); }

:root {
  --bg: #0B1220; --panel: #0F1829; --panel-2: #132036; --line: #1F2C46; --line-2: #2A3A5A;
  --text: #DCE4F2; --muted: #8592AB; --faint: #5D6A84; --brand: #5B8DEF;
  --pos: #4FC48F; --neg: #EF7F7F; --warn: #E3A76A;
  --sans: "IBM Plex Sans", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", "Noto Sans Mono CJK SC", "PingFang SC", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 675px; overflow: hidden; }
body {
  position: relative; background: var(--bg); color: var(--text);
  font: 16px/1.4 var(--sans); -webkit-font-smoothing: antialiased;
  padding: 34px 44px 28px; display: flex; flex-direction: column;
}
.top { display: flex; align-items: center; gap: 14px; }
.logo { width: 34px; height: 34px; flex: none; }
.brand { font: 600 20px/1 var(--sans); letter-spacing: -.005em; }
.brand span { color: var(--muted); font-weight: 400; }
.pill {
  margin-left: auto; font: 600 15px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 7px 10px; border-radius: 4px; color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent);
}
.sub { margin-top: 10px; font: 500 14px/1.3 var(--mono); color: var(--faint); letter-spacing: .02em; }
.sub b { color: var(--brand); font-weight: 500; }

.panel {
  margin-top: 18px; flex: 1; min-height: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 18px; overflow: hidden;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th {
  font: 500 12px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em;
  color: var(--faint); text-align: right; padding: 11px 10px 9px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td {
  padding: 0 10px; height: 48px; border-bottom: 1px solid var(--line); text-align: right;
  font: 400 17px/1.15 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap;
}
tbody tr:last-child td { border-bottom: 0; }
th.l, td.l { text-align: left; }
col.rk { width: 50px; } col.re { width: 128px; } col.dd { width: 120px; }
col.sc { width: 104px; } col.tr { width: 90px; } col.cv { width: 170px; }
td.rk { color: var(--faint); }
td.sc { font-weight: 600; }
.name { font: 500 17px/1.15 var(--sans); overflow: hidden; text-overflow: ellipsis; }
.model { margin-top: 3px; font: 400 12.5px/1.15 var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.tag {
  display: inline-block; vertical-align: 2px; margin-left: 8px; font: 500 11px/1 var(--sans);
  padding: 3px 6px; border-radius: 3px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line-2);
}
.tag.bad { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 45%, transparent); background: transparent; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
svg.cv { display: block; margin-left: auto; }
svg.cv .z { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 3; }
svg.cv .ln { fill: none; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
svg.cv .ln.pos { stroke: var(--pos); } svg.cv .ln.neg { stroke: var(--neg); } svg.cv .ln.flat { stroke: var(--muted); }
.more { padding: 9px 10px 8px; font: 400 13px/1 var(--mono); color: var(--faint); border-top: 1px solid var(--line); }

.foot { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
.rules { font: 400 13.5px/1.3 var(--mono); color: var(--muted); }
.legal { display: flex; align-items: baseline; gap: 16px; }
.disclaimer { font: 500 15px/1.3 var(--sans); color: var(--text); }
.url { margin-left: auto; font: 500 14px/1 var(--mono); color: var(--brand); white-space: nowrap; }

.wm {
  position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-12deg);
  font: 700 150px/1 var(--sans); letter-spacing: .04em; color: var(--warn); opacity: .12;
  white-space: nowrap; pointer-events: none;
}
</style>
</head>
<body>
<div class="top">
  <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#132036"/><path d="M198 84 H314 M226 84 V212 L108 408 Q96 436 128 436 H384 Q416 436 404 408 L286 212 V84" fill="none" stroke="#5B8DEF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/><rect x="164" y="352" width="56" height="50" rx="10" fill="#3E6BC4"/><rect x="228" y="300" width="56" height="102" rx="10" fill="#5B8DEF"/><rect x="292" y="248" width="56" height="154" rx="10" fill="#CFE3FF"/></svg>
  <div class="brand">{{brand}} <span>· {{arena}}</span></div>
  {{pill}}
</div>
<div class="sub">{{subtitle}}</div>
<div class="panel">
  <table>
    <colgroup><col class="rk"><col><col class="re"><col class="dd"><col class="sc"><col class="tr"><col class="cv"></colgroup>
    <thead><tr>{{head}}</tr></thead>
    <tbody>
{{rows}}
    </tbody>
  </table>
  {{more}}
</div>
<div class="foot">
  <div class="rules">{{rules}}</div>
  <div class="legal"><span class="disclaimer">{{disclaimer}}</span><span class="url">{{url}}</span></div>
</div>
{{watermark}}
</body>
</html>
